<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ship your Hey app on Windows</title>
<meta name="description" content="hey_windows getting started: from a Hey app to an installer your friends download from your own site, in five commands.">
<style>
:root {
  --bg: #fbfaf7; --ink: #1d1f24; --muted: #5b616e; --line: #d9d6cf; --card: #ffffff;
  --accent: #1f5fbf; --accent-soft: #e5eefc; --ok: #1d7a46; --ok-soft: #e3f4ea;
  --warn: #9a5b00; --warn-soft: #fdf1dc; --bad: #b42318; --bad-soft: #fde8e6;
  --code-bg: #f1efe9; --win: #0b5cad;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171c; --ink: #e9e7e2; --muted: #a3a9b5; --line: #343843; --card: #1d2027;
    --accent: #7fb0ff; --accent-soft: #1d2a40; --ok: #6fd39b; --ok-soft: #173126;
    --warn: #f0b85a; --warn-soft: #362a14; --bad: #ff8a7f; --bad-soft: #3a1d1b;
    --code-bg: #23262e; --win: #6fb0ff;
  }
}
:root[data-theme="dark"] {
  --bg: #15171c; --ink: #e9e7e2; --muted: #a3a9b5; --line: #343843; --card: #1d2027;
  --accent: #7fb0ff; --accent-soft: #1d2a40; --ok: #6fd39b; --ok-soft: #173126;
  --warn: #f0b85a; --warn-soft: #362a14; --bad: #ff8a7f; --bad-soft: #3a1d1b;
  --code-bg: #23262e; --win: #6fb0ff;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 32px 16px 80px; }
h1 { font-size: 2.1rem; line-height: 1.2; margin: 0 0 12px; }
h2 { font-size: 1.45rem; line-height: 1.3; margin: 56px 0 8px; padding-top: 16px; border-top: 1px solid var(--line); }
h3 { font-size: 1.1rem; margin: 28px 0 6px; }
p, li { max-width: 70ch; }
a { color: var(--accent); }
.lede { font-size: 1.15rem; color: var(--muted); }
code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: .92em;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow-wrap: anywhere; }
pre { background: var(--code-bg); padding: 14px 16px; border-radius: 8px; overflow-x: auto;
  font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
pre code { background: none; padding: 0; overflow-wrap: normal; }
pre .q { color: var(--accent); font-weight: 600; }
pre .ok { color: var(--ok); font-weight: 600; }
pre .dim { color: var(--muted); }
figure { margin: 24px 0; }
figure svg { width: 100%; max-width: 460px; height: auto; display: block; }
figcaption { font-size: .9rem; color: var(--muted); margin-top: 6px; }
table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: .95rem; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { font-weight: 600; }
.wrap { overflow-x: auto; }
.wrap table { min-width: 560px; }
.callout { border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 12px 16px; border-radius: 0 8px 8px 0; margin: 20px 0; }
.callout.do { border-color: var(--ok); background: var(--ok-soft); }
.callout.watch { border-color: var(--warn); background: var(--warn-soft); }
.callout .tag { display: block; font-weight: 700; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
.callout p { margin: 6px 0; }
.chip { display: inline-block; font-size: .75rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; vertical-align: 2px; }
.chip.now { background: var(--ok-soft); color: var(--ok); }
.chip.later { background: var(--warn-soft); color: var(--warn); }
.chip.idea { background: var(--accent-soft); color: var(--accent); }
.toc { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 18px; }
.toc ol { margin: 6px 0; padding-left: 22px; }
.steps li { margin: 6px 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin: 16px 0; }
.card { background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--muted); border-radius: 10px; padding: 10px 14px; }
.card.req { border-left-color: var(--accent); }
.card.paid { border-left-color: var(--warn); }
.card.proposed { border-style: dashed; border-left-style: solid; }
.card h4 { margin: 2px 0 6px; font-size: 1.02rem; }
.card p { margin: 4px 0; font-size: .95rem; }
.card .pro b { color: var(--ok); }
.card .con b { color: var(--bad); }
.card .how { font-size: .9rem; }
pre.figure { margin: 24px 0 6px; }
.figcap, .sources { font-size: .9rem; color: var(--muted); margin-top: 6px; }
main > h2:first-of-type { border-top: none; margin-top: 32px; }
/* figure tokens */
.f-box { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
.f-box-ok { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1.5; }
.f-box-warn { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.5; }
.f-box-acc { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
.f-box-bad { fill: var(--bad-soft); stroke: var(--bad); stroke-width: 1.5; }
.f-win { fill: var(--win); }
.f-t { fill: var(--ink); font: 14px -apple-system, "Segoe UI", sans-serif; }
.f-tb { fill: var(--ink); font: 600 14px -apple-system, "Segoe UI", sans-serif; }
.f-ts { fill: var(--muted); font: 12px -apple-system, "Segoe UI", sans-serif; }
.f-tw { fill: #ffffff; font: 600 14px -apple-system, "Segoe UI", sans-serif; }
.f-tm { fill: var(--ink); font: 13px ui-monospace, Menlo, Consolas, monospace; }
.f-ok { fill: var(--ok); font: 600 13px -apple-system, "Segoe UI", sans-serif; }
.f-bad { fill: var(--bad); font: 600 13px -apple-system, "Segoe UI", sans-serif; }
.f-line { stroke: var(--muted); stroke-width: 1.5; fill: none; }
.f-arrow { fill: var(--muted); }
</style>
</head>
<body>
<main>
<!-- guide -->
</main>
</body>
</html>
